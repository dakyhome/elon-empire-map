name: Update prices

# This workflow OWNS prices.json. It is the only thing that should write it.
# Never re-upload a local prices.json over the committed one.

on:
  schedule:
    # 4 triggers a day, every day (no weekday filter, so there is never a
    # skipped day). GitHub's scheduler is best-effort and can run late by
    # hours, so spacing 4 shots around the close gives several chances for
    # one of them to land close to the target window instead of relying on
    # a single cron. All times are UTC, offset from :00 to dodge the
    # top-of-the-hour congestion GitHub warns about. Based on the 4pm ET
    # (EDT) close = 20:00 UTC; during EST (winter) these all sit about 1hr
    # earlier relative to the real close, which is fine since the script
    # always grabs the latest available daily close regardless of when it runs.
    #
    #   19:15 UTC = 1hr before close  -> ~03:15 GMT+8 next day
    #   20:15 UTC = at market close   -> ~04:15 GMT+8 next day
    #   21:15 UTC = 1hr after close   -> ~05:15 GMT+8 next day
    #   23:15 UTC = 3hr after close   -> ~07:15 GMT+8 next day
    - cron: "15 19 * * *"   # 1hr before close
    - cron: "15 20 * * *"   # at market close
    - cron: "15 21 * * *"   # 1hr after close
    - cron: "15 23 * * *"   # 3hr after close
  workflow_dispatch: {}   # lets you run it by hand from the Actions tab

permissions:
  contents: write          # needed to commit prices.json back to the repo

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch prices and rewrite prices.json
        env:
          ALPHAVANTAGE_KEY: ${{ secrets.ALPHAVANTAGE_KEY }}
        run: python scripts/update_prices.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add prices.json
          if git diff --staged --quiet; then
            echo "No change in prices.json."
          else
            git commit -m "Update prices.json ($(date -u +%Y-%m-%d))"
            git push
          fi
