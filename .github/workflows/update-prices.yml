name: Update prices

# This workflow OWNS prices.json. It is the only thing that should write it.
# Never re-upload a local prices.json over the committed one.

on:
  schedule:
    # The script always takes the latest available daily close, so exact timing
    # is not critical. We fire after the New York close (covering both EDT and
    # EST), plus a late catch-up once end-of-day data has surely posted.
    #
    #   21:30 UTC = 17:30 ET (EDT) / 16:30 ET (EST), just after the bell
    #   01:30 UTC = 21:30 ET (EDT) / 20:30 ET (EST) the prior weekday, catch-up
    - cron: "30 21 * * 1-5"   # shortly after the close
    - cron: "30 1 * * 2-6"    # evening ET catch-up for the prior trading day
  workflow_dispatch: {}   # lets you run it by hand from the Actions tab

permissions:
  contents: write          # needed to commit prices.json back to the repo

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch prices and rewrite prices.json
        env:
          ALPHAVANTAGE_KEY: ${{ secrets.ALPHAVANTAGE_KEY }}
        run: python scripts/update_prices.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add prices.json
          if git diff --staged --quiet; then
            echo "No change in prices.json."
          else
            git commit -m "Update prices.json ($(date -u +%Y-%m-%d))"
            git push
          fi
